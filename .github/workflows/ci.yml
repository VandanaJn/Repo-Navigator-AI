name: Python CI

on:
  push:
    branches: [main, work, work-mcp]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      CI: true
      # Short-circuits MCP toolset network init at module import — see
      # agents/repo_navigator/sub_agents/tools/mcp_tools.py. Lets unit
      # tests run hermetically with no secrets.
      TEST_ENV: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install make
        run: sudo apt-get install -y make

      - name: Run Makefile install
        run: make install

      - name: Run Makefile tests
        run: make test
